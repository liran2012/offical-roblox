<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - Online Multiplayer & Local Game</title>
  <meta name="description" content="A simple, clean, modern Tic Tac Toe game with online multiplayer via room codes, local 2-player mode, and vs AI mode built with HTML, CSS, and JS.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- PeerJS for Serverless WebRTC Online Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* Neon Palette */
      --player-x-color: #06b6d4; /* Neon Cyan */
      --player-x-glow: rgba(6, 182, 212, 0.4);
      --player-o-color: #f43f5e; /* Vibrant Rose */
      --player-o-glow: rgba(244, 63, 94, 0.4);
      --draw-color: #f59e0b; /* Amber */
      --online-color: #10b981; /* Emerald Green */

      --cell-bg: rgba(30, 41, 59, 0.6);
      --cell-hover: rgba(51, 65, 85, 0.8);
      --win-cell-bg: rgba(16, 185, 129, 0.25);

      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .bg-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.15) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      width: 100%;
    }

    .app-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, var(--player-x-color), #a855f7, var(--player-o-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.15rem;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Controls Header */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.75rem;
      border-radius: 14px;
    }

    .mode-switch {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.25rem;
      border-radius: 10px;
      gap: 0.2rem;
      flex: 1;
      margin-right: 0.5rem;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.35rem 0.4rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-align: center;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    /* Online Multiplayer Control Panel */
    .online-panel {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      display: none;
      flex-direction: column;
      gap: 0.85rem;
      animation: fadeIn 0.3s ease-out;
    }

    .online-panel.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .online-actions {
      display: flex;
      gap: 0.5rem;
    }

    .online-actions .btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      font-size: 0.85rem;
    }

    .room-input-group {
      display: flex;
      gap: 0.5rem;
    }

    .room-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      outline: none;
    }

    .room-input:focus {
      border-color: var(--player-x-color);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }

    .room-code-display {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed var(--online-color);
      border-radius: 12px;
      padding: 0.75rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      align-items: center;
    }

    .room-code-val {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: var(--online-color);
    }

    .online-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online-color);
      box-shadow: 0 0 8px var(--online-color);
      animation: pulseDot 1.2s infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
    }

    .score-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      align-items: center;
    }

    .score-card.player-x { border-bottom: 3px solid var(--player-x-color); }
    .score-card.draws { border-bottom: 3px solid var(--draw-color); }
    .score-card.player-o { border-bottom: 3px solid var(--player-o-color); }

    .score-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .score-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Status Banner */
    .status-banner {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.65rem 1rem;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
      transition: all 0.3s ease;
    }

    .turn-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .turn-badge.x {
      background: rgba(6, 182, 212, 0.15);
      color: var(--player-x-color);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .turn-badge.o {
      background: rgba(244, 63, 94, 0.15);
      color: var(--player-o-color);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    /* Emotes / Reaction Bar for Online Mode */
    .reaction-bar {
      display: none;
      gap: 0.5rem;
      justify-content: center;
      width: 100%;
    }

    .reaction-bar.active {
      display: flex;
    }

    .emote-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.35rem 0.6rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .emote-btn:hover {
      transform: scale(1.25);
    }

    /* Floating Emote Overlay */
    .emote-float {
      position: fixed;
      font-size: 3rem;
      pointer-events: none;
      z-index: 150;
      animation: floatUp 1.5s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(20px) scale(0.5); }
      20% { opacity: 1; transform: translateY(0) scale(1.2); }
      100% { opacity: 0; transform: translateY(-100px) scale(1); }
    }

    /* Game Board Grid */
    .game-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.75rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 0.75rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .cell {
      background: var(--cell-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      outline: none;
    }

    .cell:hover:not(.taken):not(.disabled) {
      background: var(--cell-hover);
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .cell.disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .cell.taken { cursor: default; }

    .cell.winning-cell {
      background: var(--win-cell-bg) !important;
      border-color: rgba(16, 185, 129, 0.6) !important;
      animation: pulseWin 1s infinite alternate ease-in-out;
    }

    @keyframes pulseWin {
      0% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
      100% { box-shadow: 0 0 22px rgba(16, 185, 129, 0.6); }
    }

    /* Symbol SVGs */
    .symbol-svg {
      width: 58%;
      height: 58%;
      filter: drop-shadow(0 0 8px transparent);
      transition: filter 0.3s ease;
    }

    .cell.x .symbol-svg { filter: drop-shadow(0 0 10px var(--player-x-glow)); }
    .cell.o .symbol-svg { filter: drop-shadow(0 0 10px var(--player-o-glow)); }

    .pop-in {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Footer Buttons */
    .actions-bar {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      border: none;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #047857, #059669);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #161e31;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .modal-overlay.active .modal-content { transform: scale(1); }

    .winner-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-title { font-size: 1.5rem; font-weight: 800; }
    .modal-desc { font-size: 0.9rem; color: var(--text-muted); }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <!-- Header -->
    <header>
      <h1 class="app-title">TIC TAC TOE</h1>
      <p class="app-subtitle">Local, Online & vs Computer Modes</p>
    </header>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="mode-switch">
        <button class="mode-btn active" id="mode-pvp" onclick="setGameMode('pvp')">2 Players</button>
        <button class="mode-btn" id="mode-online" onclick="setGameMode('online')">🌐 Online</button>
        <button class="mode-btn" id="mode-pve" onclick="setGameMode('pve')">vs Computer</button>
      </div>

      <button class="icon-btn" id="sound-toggle" onclick="toggleSound()" title="Toggle Sound">
        <svg id="sound-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <!-- Online Room Panel -->
    <div class="online-panel" id="online-panel">
      <div class="online-actions">
        <button class="btn btn-success" onclick="createOnlineRoom()">Create Room</button>
        <span style="align-self: center; font-weight: 700; color: var(--text-muted); font-size: 0.8rem;">OR</span>
        <div class="room-input-group">
          <input type="text" id="room-code-input" class="room-input" placeholder="CODE" maxlength="6">
          <button class="btn btn-primary" onclick="joinOnlineRoom()">Join</button>
        </div>
      </div>

      <!-- Room Code Display Box (Host view) -->
      <div class="room-code-display" id="room-info-box" style="display: none;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted);">YOUR ROOM CODE:</span>
        <div class="room-code-val" id="created-code-text">------</div>
        <div class="online-status">
          <span class="pulse-dot"></span>
          <span id="online-status-text">Waiting for opponent to join...</span>
        </div>
        <button class="btn btn-secondary" style="margin-top: 0.25rem; font-size: 0.75rem; padding: 0.35rem;" onclick="copyRoomCode()">
          📋 Copy Room Code
        </button>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card player-x" id="card-x">
        <div class="score-title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--player-x-color)" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span id="label-x">Player X</span>
        </div>
        <div class="score-val" id="score-x">0</div>
      </div>

      <div class="score-card draws" id="card-draws">
        <div class="score-title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--draw-color)" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle></svg>
          Draws
        </div>
        <div class="score-val" id="score-draws">0</div>
      </div>

      <div class="score-card player-o" id="card-o">
        <div class="score-title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--player-o-color)" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle></svg>
          <span id="label-o">Player O</span>
        </div>
        <div class="score-val" id="score-o">0</div>
      </div>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="status-banner">
      <span>Turn:</span>
      <span class="turn-badge x" id="turn-badge">Player X</span>
    </div>

    <!-- Online Emotes Bar -->
    <div class="reaction-bar" id="reaction-bar">
      <button class="emote-btn" onclick="sendEmote('👏')">👏</button>
      <button class="emote-btn" onclick="sendEmote('🔥')">🔥</button>
      <button class="emote-btn" onclick="sendEmote('😂')">😂</button>
      <button class="emote-btn" onclick="sendEmote('🎯')">🎯</button>
      <button class="emote-btn" onclick="sendEmote('👑')">👑</button>
    </div>

    <!-- 3x3 Grid -->
    <div class="game-board" id="board">
      <button class="cell" data-index="0" aria-label="Square 1"></button>
      <button class="cell" data-index="1" aria-label="Square 2"></button>
      <button class="cell" data-index="2" aria-label="Square 3"></button>
      <button class="cell" data-index="3" aria-label="Square 4"></button>
      <button class="cell" data-index="4" aria-label="Square 5"></button>
      <button class="cell" data-index="5" aria-label="Square 6"></button>
      <button class="cell" data-index="6" aria-label="Square 7"></button>
      <button class="cell" data-index="7" aria-label="Square 8"></button>
      <button class="cell" data-index="8" aria-label="Square 9"></button>
    </div>

    <!-- Actions Bar -->
    <div class="actions-bar">
      <button class="btn btn-primary" onclick="restartGame(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        Restart Game
      </button>

      <button class="btn btn-secondary" onclick="resetScores()" title="Reset Scoreboard">
        Reset Scores
      </button>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="winner-icon-wrapper" id="modal-icon-container"></div>
      <h2 class="modal-title" id="modal-title">Player X Wins!</h2>
      <p class="modal-desc" id="modal-desc">Great move! Click below to start the next round.</p>
      <button class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" onclick="closeModalAndRestart()">
        Play Next Round
      </button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // --- State Variables ---
    let boardState = Array(9).fill(null);
    let currentPlayer = 'X';
    let isGameActive = true;
    let gameMode = 'pvp'; // 'pvp', 'online', or 'pve'
    let soundEnabled = true;

    // Online WebRTC PeerJS state
    let peer = null;
    let conn = null;
    let myOnlineRole = null; // 'X' (Host) or 'O' (Client)
    let currentRoomCode = '';

    let scores = { X: 0, O: 0, draws: 0 };

    const WINNING_COMBINATIONS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    // DOM Elements
    const cells = document.querySelectorAll('.cell');
    const turnBadge = document.getElementById('turn-badge');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');
    const scoreDrawsEl = document.getElementById('score-draws');

    const labelX = document.getElementById('label-x');
    const labelO = document.getElementById('label-o');

    const onlinePanel = document.getElementById('online-panel');
    const roomInfoBox = document.getElementById('room-info-box');
    const createdCodeText = document.getElementById('created-code-text');
    const onlineStatusText = document.getElementById('online-status-text');
    const reactionBar = document.getElementById('reaction-bar');

    const winnerModal = document.getElementById('winner-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalIconContainer = document.getElementById('modal-icon-container');

    // Web Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
    }

    function playTone(freq, type, duration, vol = 0.1) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playMoveSound(player) {
      playTone(player === 'X' ? 440 : 330, player === 'X' ? 'sine' : 'triangle', 0.14, 0.15);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      setTimeout(() => playTone(523.25, 'sine', 0.15, 0.2), 0);
      setTimeout(() => playTone(659.25, 'sine', 0.15, 0.2), 120);
      setTimeout(() => playTone(783.99, 'sine', 0.25, 0.25), 240);
    }

    function playDrawSound() {
      if (!soundEnabled) return;
      setTimeout(() => playTone(300, 'sawtooth', 0.15, 0.1), 0);
      setTimeout(() => playTone(250, 'sawtooth', 0.25, 0.1), 120);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      icon.innerHTML = soundEnabled 
        ? `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`
        : `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
    }

    // SVG Helpers
    function getXSVG() {
      return `
        <svg class="symbol-svg pop-in" viewBox="0 0 100 100">
          <line x1="20" y1="20" x2="80" y2="80" stroke="var(--player-x-color)" stroke-width="14" stroke-linecap="round"/>
          <line x1="80" y1="20" x2="20" y2="80" stroke="var(--player-x-color)" stroke-width="14" stroke-linecap="round"/>
        </svg>
      `;
    }

    function getOSVG() {
      return `
        <svg class="symbol-svg pop-in" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="32" stroke="var(--player-o-color)" stroke-width="14" fill="none" stroke-linecap="round"/>
        </svg>
      `;
    }

    // Event Listeners
    cells.forEach(cell => {
      cell.addEventListener('click', handleCellClick);
    });

    function handleCellClick(e) {
      initAudio();
      const cell = e.currentTarget;
      const index = parseInt(cell.getAttribute('data-index'));

      if (boardState[index] !== null || !isGameActive) return;

      // Online turn enforcement
      if (gameMode === 'online') {
        if (!conn || !conn.open) {
          alert('Not connected to an opponent!');
          return;
        }
        if (currentPlayer !== myOnlineRole) {
          return; // Not your turn
        }
      }

      makeMove(index, currentPlayer);

      // Send WebRTC message if online
      if (gameMode === 'online' && conn && conn.open) {
        conn.send({ type: 'MOVE', index: index, player: myOnlineRole });
      }

      // AI Move turn
      if (isGameActive && gameMode === 'pve' && currentPlayer === 'O') {
        cells.forEach(c => c.classList.add('disabled'));
        setTimeout(() => {
          makeAIMove();
          cells.forEach(c => c.classList.remove('disabled'));
        }, 400);
      }
    }

    function makeMove(index, player) {
      boardState[index] = player;
      const cell = cells[index];
      cell.classList.add('taken', player.toLowerCase());
      cell.innerHTML = player === 'X' ? getXSVG() : getOSVG();
      
      playMoveSound(player);

      const winCombo = checkWin(boardState, player);
      if (winCombo) {
        handleWin(player, winCombo);
        return;
      }

      if (checkDraw(boardState)) {
        handleDraw();
        return;
      }

      // Switch Turn
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateTurnUI();
    }

    function updateTurnUI() {
      if (gameMode === 'pve' && currentPlayer === 'O') {
        turnBadge.textContent = 'Computer...';
        turnBadge.className = 'turn-badge o';
      } else if (gameMode === 'online') {
        const isMyTurn = (currentPlayer === myOnlineRole);
        turnBadge.textContent = isMyTurn ? `Your Turn (${myOnlineRole})` : `Opponent's Turn (${currentPlayer})`;
        turnBadge.className = `turn-badge ${currentPlayer.toLowerCase()}`;
      } else {
        turnBadge.textContent = `Player ${currentPlayer}`;
        turnBadge.className = `turn-badge ${currentPlayer.toLowerCase()}`;
      }
    }

    function checkWin(board, player) {
      for (const combo of WINNING_COMBINATIONS) {
        if (combo.every(index => board[index] === player)) return combo;
      }
      return null;
    }

    function checkDraw(board) {
      return board.every(cell => cell !== null);
    }

    function handleWin(winner, combo) {
      isGameActive = false;
      scores[winner]++;
      updateScoreboard();

      combo.forEach(idx => cells[idx].classList.add('winning-cell'));

      playWinSound();
      triggerConfetti();

      let winnerName;
      if (gameMode === 'pve' && winner === 'O') winnerName = 'Computer';
      else if (gameMode === 'online') winnerName = (winner === myOnlineRole) ? 'You Win! 🎉' : 'Opponent Wins!';
      else winnerName = `Player ${winner} Wins! 🎉`;

      setTimeout(() => {
        modalTitle.textContent = winnerName;
        modalDesc.textContent = `Great round! Score has been updated.`;
        modalIconContainer.innerHTML = winner === 'X' ? getXSVG() : getOSVG();
        winnerModal.classList.add('active');
      }, 500);
    }

    function handleDraw() {
      isGameActive = false;
      scores.draws++;
      updateScoreboard();
      playDrawSound();

      setTimeout(() => {
        modalTitle.textContent = `It's a Draw! 🤝`;
        modalDesc.textContent = `Well fought by both sides!`;
        modalIconContainer.innerHTML = `<svg class="symbol-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" stroke="var(--draw-color)" stroke-width="12" fill="none"/></svg>`;
        winnerModal.classList.add('active');
      }, 400);
    }

    function updateScoreboard() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawsEl.textContent = scores.draws;
    }

    function closeModalAndRestart() {
      winnerModal.classList.remove('active');
      restartGame(true);
    }

    function restartGame(broadcast = false) {
      boardState = Array(9).fill(null);
      isGameActive = true;
      currentPlayer = 'X';

      cells.forEach(cell => {
        cell.className = 'cell';
        cell.innerHTML = '';
      });

      updateTurnUI();

      if (broadcast && gameMode === 'online' && conn && conn.open) {
        conn.send({ type: 'RESTART' });
      }
    }

    function resetScores() {
      scores = { X: 0, O: 0, draws: 0 };
      updateScoreboard();
      restartGame(true);
    }

    function setGameMode(mode) {
      if (gameMode === mode) return;
      gameMode = mode;

      document.getElementById('mode-pvp').classList.toggle('active', mode === 'pvp');
      document.getElementById('mode-online').classList.toggle('active', mode === 'online');
      document.getElementById('mode-pve').classList.toggle('active', mode === 'pve');
      
      onlinePanel.classList.toggle('active', mode === 'online');
      reactionBar.classList.toggle('active', mode === 'online');

      if (mode === 'pve') {
        labelX.textContent = 'Player X';
        labelO.textContent = 'Computer';
      } else if (mode === 'online') {
        labelX.textContent = 'Player X (Host)';
        labelO.textContent = 'Player O (Guest)';
      } else {
        labelX.textContent = 'Player X';
        labelO.textContent = 'Player O';
      }

      resetScores();
    }

    // --- PeerJS WebRTC Online Multiplayer ---
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function createOnlineRoom() {
      currentRoomCode = generateRoomCode();
      const peerId = 'ttt-room-' + currentRoomCode;

      if (peer) peer.destroy();

      onlineStatusText.textContent = 'Initializing server connection...';
      roomInfoBox.style.display = 'flex';
      createdCodeText.textContent = currentRoomCode;

      peer = new Peer(peerId);

      peer.on('open', (id) => {
        myOnlineRole = 'X';
        onlineStatusText.textContent = 'Waiting for opponent to enter code...';
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupDataConnection();
        onlineStatusText.textContent = '🟢 Opponent Connected! Game Started.';
        restartGame(false);
      });

      peer.on('error', (err) => {
        console.error(err);
        onlineStatusText.textContent = '⚠️ Code collision. Generating new code...';
        setTimeout(createOnlineRoom, 1000);
      });
    }

    function joinOnlineRoom() {
      const codeInput = document.getElementById('room-code-input').value.trim().toUpperCase();
      if (!codeInput || codeInput.length < 5) {
        alert('Please enter a valid 6-character Room Code!');
        return;
      }

      currentRoomCode = codeInput;
      const hostPeerId = 'ttt-room-' + currentRoomCode;

      if (peer) peer.destroy();

      peer = new Peer(); // Auto-assigned ID for guest

      peer.on('open', () => {
        onlineStatusText.textContent = 'Connecting to room...';
        roomInfoBox.style.display = 'flex';
        createdCodeText.textContent = currentRoomCode;

        conn = peer.connect(hostPeerId);
        myOnlineRole = 'O';
        setupDataConnection();
      });

      peer.on('error', (err) => {
        alert('Could not connect to room code ' + currentRoomCode + '. Make sure the room exists!');
        onlineStatusText.textContent = '❌ Connection failed.';
      });
    }

    function setupDataConnection() {
      conn.on('open', () => {
        onlineStatusText.textContent = `🟢 Connected! You are Player ${myOnlineRole}`;
        restartGame(false);
      });

      conn.on('data', (data) => {
        if (data.type === 'MOVE') {
          if (boardState[data.index] === null && isGameActive) {
            makeMove(data.index, data.player);
          }
        } else if (data.type === 'RESTART') {
          restartGame(false);
        } else if (data.type === 'EMOTE') {
          showFloatingEmote(data.emote);
        }
      });

      conn.on('close', () => {
        onlineStatusText.textContent = '🔴 Opponent disconnected.';
        alert('Opponent disconnected from room.');
      });
    }

    function copyRoomCode() {
      if (!currentRoomCode) return;
      navigator.clipboard.writeText(currentRoomCode).then(() => {
        alert('Room Code ' + currentRoomCode + ' copied to clipboard!');
      });
    }

    function sendEmote(emote) {
      showFloatingEmote(emote);
      if (gameMode === 'online' && conn && conn.open) {
        conn.send({ type: 'EMOTE', emote: emote });
      }
    }

    function showFloatingEmote(emote) {
      const el = document.createElement('div');
      el.className = 'emote-float';
      el.textContent = emote;
      el.style.left = (window.innerWidth / 2 + (Math.random() * 120 - 60)) + 'px';
      el.style.top = (window.innerHeight / 2 + (Math.random() * 60 - 30)) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }

    // Auto Join if URL has ?room=XXXXXX
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        setGameMode('online');
        document.getElementById('room-code-input').value = roomParam;
        setTimeout(joinOnlineRoom, 500);
      }
    });

    // Minimax AI for vs Computer Mode
    function makeAIMove() {
      if (!isGameActive) return;

      const emptyIndices = boardState
        .map((val, idx) => val === null ? idx : null)
        .filter(val => val !== null);

      if (emptyIndices.length === 0) return;

      let targetIndex;
      if (Math.random() < 0.85) {
        targetIndex = getBestMove(boardState, 'O').index;
      } else {
        targetIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }

      if (targetIndex !== undefined && targetIndex !== null) {
        makeMove(targetIndex, 'O');
      }
    }

    function getBestMove(newBoard, player) {
      const availSpots = newBoard
        .map((val, idx) => val === null ? idx : null)
        .filter(val => val !== null);

      if (checkWin(newBoard, 'X')) return { score: -10 };
      if (checkWin(newBoard, 'O')) return { score: 10 };
      if (availSpots.length === 0) return { score: 0 };

      const moves = [];

      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        if (player === 'O') {
          const result = getBestMove(newBoard, 'X');
          move.score = result.score;
        } else {
          const result = getBestMove(newBoard, 'O');
          move.score = result.score;
        }

        newBoard[availSpots[i]] = null;
        moves.push(move);
      }

      let bestMove;
      if (player === 'O') {
        let bestScore = -10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = 10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }

      return moves[bestMove];
    }

    // Confetti Animation
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#06b6d4', '#f43f5e', '#a855f7', '#10b981', '#f59e0b'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.opacity -= 0.015;
            p.rotation += p.rSpeed;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          animationFrame = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animationFrame);
        }
      }

      render();
    }
  </script>
